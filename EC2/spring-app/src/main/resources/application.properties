server.port=3004
server.servlet.context-path=/api/spring

spring.application.name=spring-app

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5435/springdb}
spring.datasource.username=${DATABASE_USERNAME:springuser}
spring.datasource.password=${DATABASE_PASSWORD:springpass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

springdoc.api-docs.path=/docs/openapi
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operations-sorter=method

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

