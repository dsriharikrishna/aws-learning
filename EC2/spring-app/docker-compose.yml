version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: spring-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - spring-app
    networks:
      - spring-network

  spring-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spring-app
    restart: always
    ports:
      - "3004:3004"
    environment:
      SERVER_PORT: 3004
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://spring-db:5432/springdb}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-springuser}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-springpass}
    depends_on:
      spring-db:
        condition: service_healthy
    networks:
      - spring-network

  spring-db:
    image: postgres:16-alpine
    container_name: spring-postgres
    restart: always
    environment:
      POSTGRES_USER: springuser
      POSTGRES_PASSWORD: springpass
      POSTGRES_DB: springdb
    ports:
      - "5432:5432"
    volumes:
      - spring_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U springuser -d springdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spring-network

volumes:
  spring_pgdata:

networks:
  spring-network:
    driver: bridge
